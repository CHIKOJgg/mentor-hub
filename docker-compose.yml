services:
  postgres:
    image: postgres:16-alpine
    container_name: mentor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentor_hub
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT_PUBLISH:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentor_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mentor-network

  backend:
    build: .
    container_name: mentor_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mentor_hub
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      ADMIN_MENTOR_TOKEN: ${ADMIN_MENTOR_TOKEN:?Set ADMIN_MENTOR_TOKEN in .env}
      ADMIN_CURATOR_TOKEN: ${ADMIN_CURATOR_TOKEN:?Set ADMIN_CURATOR_TOKEN in .env}
      ADMIN_MENTOR_TELEGRAM_USER_ID: ${ADMIN_MENTOR_TELEGRAM_USER_ID:-}
      ADMIN_CURATOR_TELEGRAM_USER_ID: ${ADMIN_CURATOR_TELEGRAM_USER_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MentorHubBot}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mentor-network

  frontend:
    build: ./frontend
    container_name: mentor_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - mentor-network

volumes:
  pgdata:

networks:
  mentor-network:
    driver: bridge
