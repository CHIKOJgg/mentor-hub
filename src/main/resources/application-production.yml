spring:
  flyway:
    locations: classpath:db/production-migration
    baseline-on-migrate: true
    baseline-version: 9
    validate-on-migrate: true
    # Preserve existing v1-v9 histories while ensuring production only applies
    # the clean, additive v10 schema reconciliation migration.
    # Version 11 was already applied in production but is intentionally absent
    # from this migration location. Ignore both missing and later applied entries.
    ignore-migration-patterns: "*:missing,*:future"
