server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: mentor-tracker-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:mentor_hub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${AI_API_KEY:mock-key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      audio:
        transcription:
          options:
            model: whisper-1
            language: ru

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:mock-token}
    username: ${TELEGRAM_BOT_USERNAME:MentorHubBot}
    mode: ${TELEGRAM_BOT_MODE:longpolling}
  reminder:
    cron: "0 0 20 * * MON-SAT"
    zone: "Europe/Minsk"
  poll:
    cron: "0 0 18 * * SAT"
    zone: "Europe/Minsk"
