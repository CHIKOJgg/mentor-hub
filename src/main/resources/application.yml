server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mentor-tracker-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:mentor_hub}}}
    username: ${DB_USER:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:mock-key}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.2
      audio:
        transcription:
          options:
            model: ${AI_WHISPER_MODEL:whisper-1}
            language: ru

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:mock-token}
    username: ${TELEGRAM_BOT_USERNAME:MentorHubBot}
    mode: ${TELEGRAM_BOT_MODE:long-polling}
  reminder:
    cron: "0 0 20 * * MON-SAT"
    zone: "Europe/Minsk"
  poll:
    cron: "0 0 18 * * SAT"
    zone: "Europe/Minsk"
